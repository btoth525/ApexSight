name: ApexSightNative
options:
  bundleIdPrefix: com.brandontoth
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 52
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    CODE_SIGN_STYLE: Automatic
packages:
  # Prebuilt WebRTC xcframework (Metal-rendered, hardware-decoded) for instant live.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "149.0.0"
targets:
  ApexSightNative:
    type: application
    platform: iOS
    sources:
      - path: Sources/ApexSight
      - path: Sources/ApexSightShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native
        INFOPLIST_FILE: Sources/ApexSight/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSight/Resources/ApexSightNative.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSight/Resources/Info.plist
      properties:
        CFBundleDisplayName: ApexSight
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ApexSight
            CFBundleURLSchemes:
              - apex
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock ApexSight with Face ID to keep your cameras private.
        NSLocalNetworkUsageDescription: ApexSight connects to Frigate on your local network.
        NSPhotoLibraryAddUsageDescription: ApexSight saves camera clips you download to your photo library.
        # Required by the real-time video framework ApexSight links for instant live view.
        # ApexSight does NOT capture or record from this device's camera or microphone —
        # it only plays the live streams from your Frigate cameras. (Fixes ITMS-90683.)
        NSCameraUsageDescription: ApexSight uses real-time video components to play your live camera feeds instantly. It does not capture or record from this device's camera.
        NSMicrophoneUsageDescription: ApexSight's real-time video components require this permission. ApexSight does not record audio from this device's microphone.
        NSSupportsLiveActivities: true
        # Export compliance: only standard HTTPS/TLS — exempt encryption. Setting this
        # clears the manual encryption question on every TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.brandontoth.apexsight.refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - target: ApexSightWidgets
        embed: true
      - target: ApexSightNotificationService
        embed: true
      - target: ApexSightWatch
        embed: true
      - package: WebRTC
    scheme:
      testTargets: []

  ApexSightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ApexSightWidgets
      - path: Sources/ApexSightShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.widgets
        INFOPLIST_FILE: Sources/ApexSightWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSightWidgets/ApexSightWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightWidgets/Info.plist
      properties:
        CFBundleDisplayName: ApexSight Widgets
        # Let the widget reach a local/HTTP Frigate for its background refresh.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ApexSightWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ApexSightWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.watchkitapp
        INFOPLIST_FILE: Sources/ApexSightWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightWatch/Info.plist
      properties:
        CFBundleDisplayName: ApexSight
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.brandontoth.apexsight.native

  ApexSightTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ApexSightTV
      # Shared, platform-agnostic core (Foundation / AVFoundation / Security / UIKit subset).
      - path: Sources/ApexSight/Networking/FrigateClient.swift
      - path: Sources/ApexSight/Networking/ImageCache.swift
      - path: Sources/ApexSight/Models/FrigateModels.swift
      - path: Sources/ApexSight/Security/KeychainStore.swift
    settings:
      base:
        # Shared bundle ID with the iOS app so the Apple TV build lands under the
        # same ApexSight record in App Store Connect as its tvOS version.
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native
        INFOPLIST_FILE: Sources/ApexSightTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightTV/Info.plist
      properties:
        CFBundleDisplayName: ApexSight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: []

  ApexSightNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ApexSightNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.NotificationService
        INFOPLIST_FILE: Sources/ApexSightNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSightNotificationService/ApexSightNotificationService.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightNotificationService/Info.plist
      properties:
        CFBundleDisplayName: ApexSight Alerts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
