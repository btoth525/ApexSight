name: ApexSightNative
options:
  bundleIdPrefix: com.brandontoth
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "149.0.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 137
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    CODE_SIGN_STYLE: Automatic
targets:
  ApexSightNative:
    type: application
    platform: iOS
    sources:
      - path: Sources/ApexSight
      - path: Sources/ApexSightShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native
        INFOPLIST_FILE: Sources/ApexSight/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSight/Resources/ApexSightNative.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSight/Resources/Info.plist
      properties:
        CFBundleDisplayName: ApexSight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # App uses only standard HTTPS/TLS — exempt from export compliance, so
        # TestFlight stops prompting on every upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ApexSight
            CFBundleURLSchemes:
              - apex
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock ApexSight with Face ID to keep your cameras private.
        NSLocalNetworkUsageDescription: ApexSight connects to Frigate on your local network.
        NSPhotoLibraryAddUsageDescription: ApexSight saves camera clips you download to your photo library.
        NSCameraUsageDescription: ApexSight uses real-time video components to play your live camera feeds instantly. It does not capture or record from this device's camera.
        NSMicrophoneUsageDescription: ApexSight uses your microphone for two-way talk — speaking through cameras that support it. Audio is streamed live to the camera and never stored.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.brandontoth.apexsight.refresh
        # ATS: arbitrary loads stay ON because the Frigate base URL is user-supplied and the
        # supported access patterns include cleartext HTTP to hosts ATS's local-networking
        # exception does NOT cover — Tailscale CGNAT (100.64/10), custom LAN hostnames
        # (frigate.lan / router DNS), and DDNS/public-IP-over-HTTP. There's no domain we can
        # enumerate at build time for a user-entered host, so narrowing this would break those
        # setups. (Narrowing to NSAllowsLocalNetworking was evaluated and reverted for that reason.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - target: ApexSightWidgets
        embed: true
      - target: ApexSightNotificationService
        embed: true
      - target: ApexSightWatch
        embed: true
      - package: WebRTC
      # Explicitly link AppIntents so `appintentsmetadataprocessor` actually runs and extracts
      # the AppShortcutsProvider metadata. Without a hard framework dependency the build logged
      # "Metadata extraction skipped. No AppIntents.framework dependency found", which meant the
      # App Shortcuts (Siri / Spotlight "Show cameras", "Search events", etc.) never registered.
      - sdk: AppIntents.framework
    scheme:
      testTargets:
        - ApexSightTests
        - ApexSightUITests
      gatherCoverageData: true

  ApexSightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ApexSightWidgets
      - path: Sources/ApexSightShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.widgets
        INFOPLIST_FILE: Sources/ApexSightWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSightWidgets/ApexSightWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightWidgets/Info.plist
      properties:
        CFBundleDisplayName: ApexSight Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Match the app — the widget fetches camera snapshots from the same user-supplied host.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ApexSightWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/ApexSightWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.watchkitapp
        INFOPLIST_FILE: Sources/ApexSightWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Sources/ApexSightWatch/Info.plist
      properties:
        CFBundleDisplayName: ApexSight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.brandontoth.apexsight.native

  ApexSightNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ApexSightNotificationService
      # Just the shared Keychain token reader (Foundation + Security only — extension-safe),
      # so the NSE can read the bearer token from the shared Keychain group.
      - path: Sources/ApexSightShared/SharedTokenStore.swift
      # On-device Vision scene summary for AI-enriched alerts (Vision + ImageIO, extension-safe).
      - path: Sources/ApexSightShared/SceneVision.swift
      # Widget cache + fetcher (Foundation/WidgetKit — extension-safe): on every alert push the
      # NSE refreshes the home/Lock-Screen widgets with the current Frigate state, so they update
      # on alerts and clear reviewed ones without the app being opened.
      - path: Sources/ApexSightShared/SharedSnapshotStore.swift
      - path: Sources/ApexSightWidgets/WidgetDataFetcher.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.NotificationService
        INFOPLIST_FILE: Sources/ApexSightNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ApexSightNotificationService/ApexSightNotificationService.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
    info:
      path: Sources/ApexSightNotificationService/Info.plist
      properties:
        CFBundleDisplayName: ApexSight Alerts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The service extension downloads notification snapshots/GIFs, which fall back to the
        # (possibly HTTP) Frigate base URL. It previously had NO ATS exception at all, so that
        # fallback was silently blocked and local/Tailscale/DDNS users got no rich-notification
        # image. Adding the app's arbitrary-loads scope here is purely additive — it fixes that.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  ApexSightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ApexSightTests
    dependencies:
      - target: ApexSightNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ

  ApexSightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ApexSightUITests
    dependencies:
      - target: ApexSightNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandontoth.apexsight.native.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q9ZUDN4QZ
