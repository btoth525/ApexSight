{% extends "site/base.html" %}
{% block title %}Log in to ApexSight{% endblock %}
{% block nav %}<a class="btn ghost" href="/signup">Sign up</a>{% endblock %}
{% block body %}
  <div class="card" style="max-width:460px;margin-left:auto;margin-right:auto">
    <h2>Log in</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:20px"><button class="btn block" type="submit">Log in</button></div>
    </form>
    <p class="muted" style="margin-top:16px;font-size:14px">New here? <a href="/signup">Create an account</a></p>
  </div>
{% endblock %}
