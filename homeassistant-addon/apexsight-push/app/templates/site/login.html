{% extends "site/base.html" %}
{% block title %}Log in to ApexSight{% endblock %}
{% block nav %}<a class="btn ghost" href="/signup">Sign up</a>{% endblock %}
{% block body %}
  <div class="card auth">
    <h2>Log in</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <a href="/forgot" style="font-size:13px">Forgot password?</a>
      </div>
      <div style="margin-top:14px"><button class="btn block" type="submit">Log in</button></div>
    </form>
    <div class="hairline"></div>
    <p class="muted center" style="font-size:14px;margin:0">New here? <a href="/signup">Create an account</a></p>
  </div>
{% endblock %}
