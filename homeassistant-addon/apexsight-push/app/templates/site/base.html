<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ApexSight{% endblock %}</title>
  <style>
    :root { --bg:#05060a; --panel:#0e1118; --line:#1d2230; --text:#f3f5f8; --muted:#8b93a3; --cyan:#63d2ff; --cyan2:#0a84ff; }
    * { box-sizing: border-box; }
    body { margin:0; background:radial-gradient(1200px 700px at 50% -10%, #0c1322 0%, var(--bg) 55%); color:var(--text);
           font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:840px; margin:0 auto; padding:28px 20px 60px; }
    .nav { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:20px; letter-spacing:-.02em; }
    .brand .dot { width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--cyan2)); display:inline-block; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:26px; margin-top:22px; }
    h1 { font-size:34px; letter-spacing:-.03em; margin:.2em 0; }
    h2 { font-size:20px; margin:0 0 14px; }
    p.muted, .muted { color:var(--muted); }
    label { display:block; font-weight:700; font-size:13px; margin:16px 0 6px; }
    input[type=email], input[type=password], input[type=text] {
      width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
      background:#070a10; color:var(--text); font-size:16px; }
    input:focus { outline:none; border-color:var(--cyan); }
    .btn { display:inline-block; border:0; cursor:pointer; font-weight:900; font-size:15px;
      padding:13px 20px; border-radius:999px; background:linear-gradient(135deg,var(--cyan),var(--cyan2)); color:#04121f; }
    .btn.block { width:100%; text-align:center; }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
    .btn.danger { background:transparent; border:1px solid #5a2230; color:#ff6b6b; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .err { background:#2a0f15; border:1px solid #5a2230; color:#ff9aa6; padding:12px 14px; border-radius:12px; margin-top:14px; font-size:14px; }
    code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    pre { background:#070a10; border:1px solid var(--line); border-radius:12px; padding:14px; overflow:auto; font-size:13px; color:#cdd6e4; }
    .token { font-family:ui-monospace,Menlo,monospace; background:#070a10; border:1px solid var(--line);
             border-radius:10px; padding:10px 12px; word-break:break-all; font-size:14px; color:var(--cyan); }
    .feat { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }
    .feat div { background:#0a0e16; border:1px solid var(--line); border-radius:14px; padding:14px; }
    .feat b { display:block; margin-bottom:4px; }
    footer { color:var(--muted); font-size:13px; margin-top:30px; }
    @media (max-width:560px){ .feat{grid-template-columns:1fr;} h1{font-size:28px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a class="brand" href="/"><span class="dot"></span> ApexSight</a>
      <div class="row">{% block nav %}{% endblock %}</div>
    </div>
    {% block body %}{% endblock %}
    <footer>ApexSight · Local-first Frigate NVR companion · <a href="/admin">Relay admin</a></footer>
  </div>
</body>
</html>
