# ApexSight push relay.
#
# You already expose containers to the web (your own Cloudflare Tunnel / reverse
# proxy), so this just runs the relay and publishes port 3421. Point your tunnel
# / proxy at http://<this-host>:3421  (or, if your tunnel runs in Docker, attach
# this service to its network and route to  http://relay:3421 ).
#
#   cp .env.example .env   # set APEX_ADMIN_USERNAME + APEX_ADMIN_PASSWORD
#   docker compose up -d
#   open https://relay.plexserver525.com/admin   → upload your .p8
services:
  relay:
    build: .
    container_name: apexsight-relay
    restart: unless-stopped
    env_file: .env
    volumes:
      - relay-data:/data
    # Host:container port. Both follow APEX_PORT from .env (default 3421).
    ports:
      - "${APEX_PORT:-3421}:${APEX_PORT:-3421}"
    # If your Cloudflare Tunnel (or other proxy) runs in Docker, join its network
    # instead of / in addition to publishing the port, and route it to relay:3421:
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: <your-existing-proxy-network>

volumes:
  relay-data:
